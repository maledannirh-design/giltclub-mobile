<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#183b2b">
<title>GMTC Video Lab</title>
<style>
:root{--bg:#f2e8d5;--card:#fff;--ink:#2e5d3a;--muted:#607466;--line:rgba(46,93,58,.18)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.shell{max-width:900px;margin:0 auto;padding:14px 12px 30px}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.back{border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:var(--card);color:inherit;text-decoration:none;font-weight:600}
h1{font-size:clamp(24px,5vw,34px);margin:0}.sub{color:var(--muted);margin-top:5px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px}
.video-stage{position:relative;width:100%;background:#111;border-radius:12px;overflow:hidden;line-height:0}.video-stage video{width:100%;max-height:60vh;display:block;object-fit:contain}.multi-stage{background:#111;border-radius:12px;overflow:hidden;margin-bottom:8px}.multi-stage video{width:100%;max-height:36vh;display:block;object-fit:contain}.multi-label{font-size:12px;font-weight:700;padding:7px 10px;background:var(--card);line-height:1.3}.multi-speed{padding:8px 10px;background:var(--card);line-height:1.4}.multi-speed label{display:block;font-size:13px;margin-bottom:4px}.multi-speed input{width:100%;accent-color:var(--ink)}.multi-controls[hidden],#multiStage[hidden]{display:none}body.multi-mode .single-only{display:none}.video-stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;pointer-events:none}.empty{display:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}button,label.file-btn{font:inherit;font-weight:600;border:1px solid var(--line);border-radius:11px;background:var(--card);color:inherit;padding:10px 12px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
input[type=range]{width:100%;accent-color:var(--ink)}.field{display:grid;gap:8px;margin-top:12px}.speed-label{display:block;margin-bottom:6px}.colors{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.color{width:30px;height:30px;min-width:30px;padding:0;border:2px solid transparent;border-radius:50%;box-shadow:0 0 0 1px #888}.color[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:2px}.tool-label{font-weight:650;margin-top:12px}.hint{font-size:12px;color:var(--muted);line-height:1.45;margin:10px 0 0}
@media(prefers-color-scheme:dark){:root{--bg:#1f241f;--card:#2a302a;--ink:#e6e1d6;--muted:#a8b3a0;--line:rgba(255,255,255,.12)}}
</style>
</head>
<body><main class="shell">
<header class="top"><a class="back" href="./index.html">← Video Lab</a><div><h1>Video Lab</h1><div class="sub">Tennis Motion Review</div></div></header>
<section class="panel">
<div id="empty" class="empty" hidden></div>
<div id="multiStage" hidden><div class="multi-stage"><div class="multi-label">VIDEO 2 — ATAS</div><video id="video2" playsinline controls></video><div class="multi-speed"><label for="speed2">Playback speed atas: <strong id="speedLabel2">1×</strong></label><input id="speed2" type="range" min="0.25" max="2" step="0.25" value="1" disabled></div><label class="file-btn" for="videoFile2" style="display:inline-block;margin:8px">＋ Pilih Video Atas</label></div></div><div id="videoStage" class="video-stage" hidden><video id="video" playsinline controls></video><canvas id="drawCanvas" aria-label="Lapisan coretan"></canvas></div><div id="bottomMultiSpeed" class="multi-speed" hidden><label for="speedBottom">Playback speed bawah: <strong id="speedLabelBottom">1×</strong></label><input id="speedBottom" type="range" min="0.25" max="2" step="0.25" value="1" disabled></div>
<input id="videoFile" type="file" accept="video/*" hidden><input id="videoFile2" type="file" accept="video/*" hidden>
<div class="actions"><label class="file-btn" for="videoFile">＋ Import Video</label><button id="multiToggle" type="button">▣ Multivideo</button></div>
<div id="singleControls" class="single-only"><div class="field"><label class="speed-label" for="speed">Playback speed: <strong id="speedLabel">1×</strong></label><input id="speed" type="range" min="0.25" max="2" step="0.25" value="1" disabled></div></div>
</section>
<section class="panel"><h2 style="margin:4px 0 0">Coretan</h2>
<div class="actions"><button id="drawToggle" disabled aria-pressed="false">✎ Pensil</button><button id="clearDrawing" disabled>Hapus coretan</button></div>
<div class="tool-label">Warna</div><div class="colors" id="colors">
<button class="color" data-color="#ff0000" style="background:#ff0000" aria-label="Merah" aria-pressed="true"></button>
<button class="color" data-color="#ff7f00" style="background:#ff7f00" aria-label="Jingga" aria-pressed="false"></button>
<button class="color" data-color="#ffff00" style="background:#ffff00" aria-label="Kuning" aria-pressed="false"></button>
<button class="color" data-color="#00b050" style="background:#00b050" aria-label="Hijau" aria-pressed="false"></button>
<button class="color" data-color="#0070ff" style="background:#0070ff" aria-label="Biru" aria-pressed="false"></button>
<button class="color" data-color="#4b0082" style="background:#4b0082" aria-label="Nila" aria-pressed="false"></button>
<button class="color" data-color="#9400d3" style="background:#9400d3" aria-label="Ungu" aria-pressed="false"></button>
</div>
</section></main>
<script>
(()=>{const input=document.getElementById('videoFile'),input2=document.getElementById('videoFile2'),video2=document.getElementById('video2'),multiStage=document.getElementById('multiStage'),multiToggle=document.getElementById('multiToggle'),singleControls=document.getElementById('singleControls'),video=document.getElementById('video'),empty=document.getElementById('empty'),stage=document.getElementById('videoStage'),canvas=document.getElementById('drawCanvas'),ctx=canvas.getContext('2d'),speed=document.getElementById('speed'),speedLabel=document.getElementById('speedLabel'),speed2=document.getElementById('speed2'),speedLabel2=document.getElementById('speedLabel2'),speedBottom=document.getElementById('speedBottom'),speedLabelBottom=document.getElementById('speedLabelBottom'),bottomMultiSpeed=document.getElementById('bottomMultiSpeed'),presets=[...document.querySelectorAll('.speed-preset')],drawToggle=document.getElementById('drawToggle'),clear=document.getElementById('clearDrawing'),colorButtons=[...document.querySelectorAll('.color')];let objectUrl='',objectUrl2='',multiMode=false,drawing=false,isDrawing=false,lastX=0,lastY=0,selectedColor='#ff0000';
function enabled(on){[speed,drawToggle,clear,...presets].forEach(el=>el.disabled=!on);speedBottom.disabled=!on;speed2.disabled=!on}
function fitCanvas(){const r=stage.getBoundingClientRect();if(!r.width||!r.height)return;const dpr=window.devicePixelRatio||1;canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height)}
multiToggle.addEventListener('click',()=>{multiMode=!multiMode;document.body.classList.toggle('multi-mode',multiMode);multiStage.hidden=!multiMode;bottomMultiSpeed.hidden=!multiMode||!video.src;multiToggle.textContent=multiMode?'▣ Multivideo Aktif':'▣ Multivideo';if(multiMode){video.controls=true;video2.controls=true;video.style.maxHeight='36vh'}else{video.controls=true;video2.pause();video2.controls=true;video.style.maxHeight='60vh'}});
input2.addEventListener('change',()=>{const file=input2.files&&input2.files[0];if(!file)return;if(!file.type.startsWith('video/')){alert('Pilih file video yang valid.');return}if(objectUrl2)URL.revokeObjectURL(objectUrl2);objectUrl2=URL.createObjectURL(file);video2.src=objectUrl2;video2.load();video2.controls=true;multiStage.hidden=false;multiMode=true;document.body.classList.add('multi-mode');multiToggle.textContent='▣ Multivideo Aktif';video.controls=true;video.style.maxHeight='36vh';speed2.disabled=false;video2.playbackRate=Number(speed2.value);bottomMultiSpeed.hidden=!video.src});
const initialVideo=new URLSearchParams(location.search).get('video');
if(initialVideo){video.src=initialVideo;video.load();video.hidden=false;stage.hidden=false;enabled(true);video.controls=true;video.onloadedmetadata=()=>{video.playbackRate=Number(speed.value);fitCanvas()};}
input.addEventListener('change',()=>{const file=input.files&&input.files[0];if(!file)return;if(!file.type.startsWith('video/')){alert('Pilih file video yang valid.');return}if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(file);video.pause();video.src=objectUrl;video.load();video.hidden=false;stage.hidden=false;empty.hidden=true;enabled(true);video.controls=true;drawing=false;drawToggle.setAttribute('aria-pressed','false');drawToggle.textContent='✎ Pensil';canvas.style.pointerEvents='none';clearCanvas();video.onloadedmetadata=()=>{video.playbackRate=Number(speed.value);fitCanvas();speedBottom.disabled=false;video.playbackRate=multiMode?Number(speedBottom.value):Number(speed.value);bottomMultiSpeed.hidden=!multiMode};});
speed.addEventListener('input',()=>{video.playbackRate=Number(speed.value);speedLabel.textContent=speed.value+'×'});speed2.addEventListener('input',()=>{video2.playbackRate=Number(speed2.value);speedLabel2.textContent=speed2.value+'×'});speedBottom.addEventListener('input',()=>{video.playbackRate=Number(speedBottom.value);speedLabelBottom.textContent=speedBottom.value+'×'});presets.forEach(b=>b.addEventListener('click',()=>{speed.value=b.dataset.speed;speed.dispatchEvent(new Event('input'))}));
drawToggle.addEventListener('click',()=>{drawing=!drawing;canvas.style.pointerEvents=drawing?'auto':'none';canvas.style.cursor=drawing?'crosshair':'default';drawToggle.setAttribute('aria-pressed',String(drawing));drawToggle.textContent=drawing?'✓ Pensil aktif':'✎ Pensil'});
colorButtons.forEach(b=>b.addEventListener('click',()=>{selectedColor=b.dataset.color;colorButtons.forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{if(!drawing)return;e.preventDefault();isDrawing=true;const p=point(e);lastX=p.x;lastY=p.y;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!isDrawing)return;e.preventDefault();const p=point(e);ctx.strokeStyle=selectedColor;ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();lastX=p.x;lastY=p.y});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>canvas.addEventListener(ev,()=>isDrawing=false));
clear.addEventListener('click',clearCanvas);window.addEventListener('resize',fitCanvas);window.addEventListener('beforeunload',()=>{if(objectUrl)URL.revokeObjectURL(objectUrl)});
})();
</script></body></html>
