eight:320px;background:#111;border-radius:10px;object-fit:contain}.mastery-button{margin-top:10px;width:100%;background:linear-gradient(115deg,#7d5a13,#f8df82,#b8860b,#fff0ad,#9b7115);background-size:220% 100%;color:#382607;border:1px solid #d6ad39;box-shadow:0 0 10px rgba(225,180,48,.35);animation:masteryShine 3s linear infinite}@keyframes masteryShine{0%{background-position:100% 0}100%{background-position:-120% 0}}.mastery-modal-backdrop{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:14px}.mastery-modal{width:min(100%,560px);max-height:88vh;overflow:auto;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.4)}.mastery-modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.mastery-modal-head h2{font-size:20px;margin:0}.mastery-skill-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.mastery-skill-name{font-size:14px}.mastery-stars{display:flex;gap:3px;flex-shrink:0}.mastery-star{padding:2px 3px;border:0;background:transparent;font-size:23px;line-height:1;color:#888;min-width:0}.mastery-star.active{color:#e8b923;text-shadow:0 0 6px rgba(232,185,35,.35)}.mastery-modal-note{font-size:12px;color:var(--muted);margin:8px 0}.mastery-modal .actions{position:sticky;bottom:-16px;background:var(--bg);padding:10px 0 2px}.card-speed{margin:10px 2px 0;font-size:13px}.card-speed label{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}.card-speed input{width:100%;accent-color:var(--ink)}.title{font-size:18px;font-weight:750;margin:10px 2px 0}.engagement{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:8px 2px 0;font-size:14px;color:var(--muted)}.metric{display:inline-flex;align-items:center;gap:5px}.like-button{padding:5px 9px;border-radius:10px;display:inline-flex;align-items:center;gap:6px}.like-button.liked{color:#e65a68;border-color:#e65a68;background:rgba(230,90,104,.08)}.like-button:disabled{opacity:.7;cursor:default}.desc{white-space:pre-wrap;line-height:1.5;margin:7px 2px 0}.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:20px;line-height:1.5;color:var(--muted)}.note{font-size:12px;color:var(--muted);line-height:1.45;margin:12px 0}.admin{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}.hidden-card{opacity:.72;border-style:dashed}.badge{font-size:12px;color:var(--muted)}

function saveSettings(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch {} }
function settingsFor(item){ return settings[item.file] || {}; }
async function saveSharedSettings(){
  if(!isAdmin || !sharedSettingsRef || !firestoreApi) throw new Error("Akses admin atau Firestore belum siap.");
  await firestoreApi.setDoc(sharedSettingsRef,{items:settings,updatedAt:firestoreApi.serverTimestamp(),updatedBy:authUser?.uid||null},{merge:true});
  const check=await firestoreApi.getDocFromServer(sharedSettingsRef);
  if(!check.exists() || !check.data()?.items) throw new Error("Data tersimpan tetapi verifikasi server gagal.");
  sharedSettingsReady=true;
  if(metadataStatus){metadataStatus.hidden=false;metadataStatus.textContent="Metadata galeri berhasil diverifikasi dari server.";}
}
async function loadSharedSettings(){
  if(!sharedSettingsRef || !firestoreApi) return;
  try{
    const snap=await firestoreApi.getDocFromServer(sharedSettingsRef);
    if(snap.exists()){
      const data=snap.data();
      if(data.items && typeof data.items==="object") settings={...settings,...data.items};
      sharedSettingsReady=true;
      if(metadataStatus){metadataStatus.hidden=true;metadataStatus.textContent="";}
    }else{
      sharedSettingsReady=false;
      if(metadataStatus){metadataStatus.hidden=false;metadataStatus.textContent="Metadata galeri belum ditemukan di server. Tampilan mungkin memakai pengaturan lokal."}
    }
  }catch(e){
    console.error("Gagal memuat metadata galeri dari server:",e);
    sharedSettingsReady=false;
    if(metadataStatus){metadataStatus.hidden=false;metadataStatus.textContent="Tidak dapat membaca metadata terbaru dari server ("+(e?.code||e?.message||"error")+"). Deskripsi yang tampil mungkin masih lokal/lama."}
  }
}
function orderedVideos(){const rank=new Map(videoOrder.map((file,i)=>[file,i]));return [...VIDEOS].sort((a,b)=>(rank.get(a.file)??9999)-(rank.get(b.file)??9999));}
function applyViewMode(){gallery.classList.toggle("grid-view",viewMode==="grid");normalViewButton?.classList.toggle("active",viewMode==="normal");gridViewButton?.classList.toggle("active",viewMode==="grid");document.body.classList.toggle("admin-layout",isAdmin);}
async function saveVideoOrder(){if(!layoutRef||!firestoreApi){alert("Urutan belum dapat disimpan ke server. Periksa koneksi dan izin Firestore.");return;}try{await firestoreApi.setDoc(layoutRef,{order:videoOrder,updatedAt:firestoreApi.serverTimestamp()},{merge:true});}catch(e){console.error("Gagal menyimpan urutan galeri:",e);alert("Urutan belum tersimpan bersama. Periksa Firestore Rules.");}}
function setupDrag(card,item){
  if(!isAdmin||viewMode!=="grid")return;
  const handle=card.querySelector(".drag-handle");
  let startX=0,startY=0,moved=false;
  const clearTargets=()=>gallery.querySelectorAll(".drop-target").forEach(el=>el.classList.remove("drop-target"));
  const finish=async target=>{
    if(!draggedFile)return;
    const source=draggedFile;draggedFile=null;
    gallery.querySelectorAll(".dragging").forEach(el=>el.classList.remove("dragging"));
    clearTargets();
    if(!target||source===target.dataset.file)return;
    const order=orderedVideos().map(v=>v.file),from=order.indexOf(source),to=order.indexOf(target.dataset.file);
    if(from<0||to<0)return;
    order.splice(from,1);order.splice(to,0,source);videoOrder=order;render();await saveVideoOrder();
  };
  card.dataset.file=item.file;
  handle.addEventListener("pointerdown",e=>{
    if(e.pointerType==="mouse"&&e.button!==0)return;
    e.preventDefault();draggedFile=item.file;startX=e.clientX;startY=e.clientY;moved=false;
    card.classList.add("dragging");
    try{handle.setPointerCapture(e.pointerId)}catch{}
  });
  handle.addEventListener("pointermove",e=>{
    if(!draggedFile)return;
    if(Math.abs(e.clientX-startX)+Math.abs(e.clientY-startY)>8)moved=true;
    if(!moved)return;
    const el=document.elementFromPoint(e.clientX,e.clientY)?.closest(".card");
    clearTargets();if(el&&el!==card)el.classList.add("drop-target");
  });
  handle.addEventListener("pointerup",async e=>{
    if(!draggedFile)return;
    const el=document.elementFromPoint(e.clientX,e.clientY)?.closest(".card");
    if(!moved){draggedFile=null;card.classList.remove("dragging");return;}
    await finish(el);
  });
  handle.addEventListener("pointercancel",()=>{draggedFile=null;card.classList.remove("dragging");clearTargets()});
}
normalViewButton.addEventListener("click",()=>{viewMode="normal";render();});
gridViewButton.addEventListener("click",()=>{viewMode="grid";render();});
function statDocId(file){ return file.replace(/[^a-zA-Z0-9_-]/g, "_"); }
function getViewerId(){ if(authUser?.uid) return authUser.uid; const key="gmtc-gallery-visitor-id"; let id=localStorage.getItem(key); if(!id){id="visitor_"+(crypto.randomUUID?crypto.randomUUID():Date.now()+"_"+Math.random().toString(36).slice(2));localStorage.setItem(key,id)} return id; }
async function setupEngagement(item, viewMetric, likeButton){
  const id=statDocId(item.file);
  if(!statsDb || !firestoreApi){viewMetric.innerHTML="◉ <span>— kali dilihat</span>";likeButton.innerHTML="👍 <span>—</span>";likeButton.disabled=true;return;}
  const {doc,getDoc,runTransaction,increment,serverTimestamp}=firestoreApi;
  const ref=doc(statsDb,"videoGalleryStats",id);
  const viewer=getViewerId();
  const viewKey=VIEW_STORAGE_KEY+":"+id;
  try{
    let snap=await getDoc(ref);
    let data=snap.exists()?snap.data():{};
    await runTransaction(statsDb,async tx=>{const s=await tx.get(ref);if(s.exists())tx.update(ref,{views:increment(1),updatedAt:serverTimestamp()});else tx.set(ref,{file:item.file,views:1,likes:0,likedBy:{},updatedAt:serverTimestamp()})});
    snap=await getDoc(ref);data=snap.exists()?snap.data():data;
    const likedBy=data.likedBy||{};
    viewMetric.innerHTML="◉ <span>"+Number(data.views||0).toLocaleString("id-ID")+" kali dilihat</span>";
    const liked=!!likedBy[viewer];
    likeButton.classList.toggle("liked",liked);
    likeButton.innerHTML="👍 <span>"+Number(data.likes||0).toLocaleString("id-ID")+"</span>";
    likeButton.setAttribute("aria-pressed",String(liked));
    likeButton.addEventListener("click",async()=>{
      likeButton.disabled=true;
      try{
        await runTransaction(statsDb,async tx=>{
          const s=await tx.get(ref);
          const d=s.exists()?s.data():{views:0,likes:0,likedBy:{}};
          const map={...(d.likedBy||{})};
          if(map[viewer]) delete map[viewer]; else map[viewer]=true;
          tx.set(ref,{file:item.file,views:Number(d.views||0),likes:Object.keys(map).length,likedBy:map,updatedAt:serverTimestamp()},{merge:true});
        });
        const updated=await getDoc(ref);const d=updated.exists()?updated.data():{};
        const nowLiked=!!(d.likedBy||{})[viewer];
        likeButton.classList.toggle("liked",nowLiked);
        likeButton.innerHTML="👍 <span>"+Number(d.likes||0).toLocaleString("id-ID")+"</span>";
        likeButton.setAttribute("aria-pressed",String(nowLiked));
      }catch(err){console.error("Gagal memperbarui like video:",err);alert("Like belum tersimpan. Periksa izin Firestore.");}
      finally{likeButton.disabled=false;}
    });
  }catch(err){console.error("Gagal memuat statistik galeri:",err);viewMetric.innerHTML="◉ <span>— kali dilihat</span>";likeButton.innerHTML="👍 <span>—</span>";likeButton.disabled=true;}
}
function openAnalysis(file){ location.href = "./analysis.html?video=" + encodeURIComponent(BASE + file); }
const SKILL_LABELS = {hitTiming:"Hit Timing",stance:"Stance",griphand:"Griphand",basicServe:"Basic Serve",basicReturnServe:"Basic Return Serve",returnVolley:"Return Volley",overhead:"Overhead",forehandBasic:"Forehand Basic",backhandBasic:"Backhand Basic",backhandVolley:"Backhand Volley",forehandVolley:"Forehand Volley",baselineVolley:"Baseline Volley",forehandSpin:"Forehand Spin",backhandSpin:"Backhand Spin",footwork:"Footwork",forehandSlice:"Forehand Slice",backhandSlice:"Backhand Slice",dribblingShot:"Dribbling Shot",baselineRally:"Baseline Rally",lowGroundVolley:"Low Ground Volley",highForehand:"High Forehand",highBackhand:"High Backhand",highSlice:"High Slice",flatServe:"Flat Serve",secondSliceServe:"Second Slice Serve",dribblingBaseline:"Dribbling Baseline",dropShot:"Drop Shot"};
let masteryCollectionRef=null;
function openMasteryModal(item, data, editMode=false){
  document.querySelector(".mastery-modal-backdrop")?.remove();
  const backdrop=document.createElement("div");backdrop.className="mastery-modal-backdrop";
  const modal=document.createElement("section");modal.className="mastery-modal";modal.setAttribute("role","dialog");modal.setAttribute("aria-modal","true");
  const heading=document.createElement("div");heading.className="mastery-modal-head";
  const title=document.createElement("h2");title.textContent="⭐ Skill Mastery";
  const close=document.createElement("button");close.type="button";close.textContent="✕";close.setAttribute("aria-label","Tutup");close.addEventListener("click",()=>backdrop.remove());heading.append(title,close);
  const sub=document.createElement("p");sub.className="mastery-modal-note";sub.textContent=item.title+" — skill prasyarat video ini.";modal.append(heading,sub);
  const rows=document.createElement("div");modal.append(rows);
  const skills={...(data?.skills||{})};
  function renderRows(){rows.replaceChildren();Object.entries(SKILL_LABELS).forEach(([key,label])=>{if(!editMode&&!Number(skills[key]||0))return;const row=document.createElement("div");row.className="mastery-skill-row";const name=document.createElement("div");name.className="mastery-skill-name";name.textContent=label;row.append(name);const stars=document.createElement("div");stars.className="mastery-stars";for(let i=1;i<=5;i++){const star=document.createElement("button");star.type="button";star.className="mastery-star"+(i<=Number(skills[key]||0)?" active":"");star.textContent="★";star.setAttribute("aria-label",label+" "+i+" dari 5");if(editMode)star.addEventListener("click",()=>{skills[key]=Number(skills[key]||0)===i?0:i;renderRows()});else star.disabled=true;stars.append(star)}row.append(stars);rows.append(row)});if(!editMode&&!Object.values(skills).some(v=>Number(v)>0)){const empty=document.createElement("p");empty.textContent="Skill prasyarat belum diatur.";rows.append(empty)}}
  renderRows();
  if(isAdmin){const actions=document.createElement("div");actions.className="actions";if(!editMode){const edit=document.createElement("button");edit.type="button";edit.textContent="✏ Edit Skill Mastery";edit.addEventListener("click",()=>openMasteryModal(item,data,true));actions.append(edit)}else{const save=document.createElement("button");save.type="button";save.textContent="💾 Save";save.addEventListener("click",async()=>{save.disabled=true;try{const clean={};Object.entries(skills).forEach(([k,v])=>{const n=Number(v);if(n>0)clean[k]=n});await firestoreApi.setDoc(firestoreApi.doc(statsDb,"videoSkillMastery",statDocId(item.file)),{videoId:item.file,title:item.title,skills:clean,updatedAt:firestoreApi.serverTimestamp(),updatedBy:authUser?.uid||null});openMasteryModal(item,{skills:clean},false)}catch(e){console.error("Gagal menyimpan Skill Mastery:",e);alert("Skill Mastery gagal disimpan. Periksa izin Firestore.");save.disabled=false}});const cancel=document.createElement("button");cancel.type="button";cancel.textContent="Batal";cancel.addEventListener("click",()=>openMasteryModal(item,data,false));actions.append(save,cancel)}modal.append(actions)}
  backdrop.addEventListener("click",e=>{if(e.target===backdrop)backdrop.remove()});backdrop.append(modal);document.body.append(backdrop);
}
function openMemberAccessModal(){document.querySelector(".mastery-modal-backdrop")?.remove();const backdrop=document.createElement("div");backdrop.className="mastery-modal-backdrop";backdrop.style.zIndex="10050";const modal=document.createElement("section");modal.className="mastery-modal";modal.style.width="min(100%,340px)";modal.style.maxHeight="none";modal.style.overflow="visible";modal.style.padding="26px 17px 20px";modal.style.borderRadius="24px";modal.style.background="#fff";modal.style.color="#315f3d";modal.style.textAlign="center";modal.setAttribute("role","dialog");modal.setAttribute("aria-modal","true");const close=document.createElement("button");close.type="button";close.textContent="×";close.setAttribute("aria-label","Tutup");close.style.cssText="position:absolute;right:8px;top:8px;width:34px;height:34px;padding:0;border:0;border-radius:50%;background:#e8ca63;color:#315f3d;font-size:24px;line-height:1";close.addEventListener("click",()=>backdrop.remove());modal.style.position="relative";const lock=document.createElement("div");lock.textContent="🔒";lock.style.cssText="width:62px;height:60px;margin:0 auto 14px;border-radius:20px;background:#e8f2e8;display:grid;place-items:center;font-size:25px";const title=document.createElement("h2");title.textContent="Akses Khusus Member";title.style.cssText="font-size:19px;margin:0 0 10px;color:#315f3d";const actions=document.createElement("div");actions.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px";const register=document.createElement("button");register.type="button";register.textContent="Daftar";register.style.cssText="border:0;border-radius:14px;background:#e7a5a7;color:#315f3d;padding:13px 8px;font-size:14px;font-weight:700";register.addEventListener("click",()=>{location.href="../index.html#register"});const login=document.createElement("button");login.type="button";login.textContent="Masuk";login.style.cssText="border:1px solid #e0e8e0;border-radius:14px;background:#fff;color:#315f3d;padding:13px 8px;font-size:14px;font-weight:700";login.addEventListener("click",()=>{location.href="../index.html#login"});actions.append(register,login);const hints=document.createElement("div");hints.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:10px;color:#68806c;font-size:11px;line-height:1.5";const hintRegister=document.createElement("div");hintRegister.textContent="Belum jadi anggota? Klik daftar";const hintLogin=document.createElement("div");hintLogin.textContent="Sudah punya akun? Klik masuk";hints.append(hintRegister,hintLogin);modal.append(close,lock,title,actions,hints);backdrop.addEventListener("click",e=>{if(e.target===backdrop)backdrop.remove()});backdrop.append(modal);document.body.append(backdrop)}
async function loadMastery(item){if(!authUser){openMemberAccessModal();return}try{if(!statsDb||!firestoreApi)return openMasteryModal(item,{});const snap=await firestoreApi.getDoc(firestoreApi.doc(statsDb,"videoSkillMastery",statDocId(item.file)));openMasteryModal(item,snap.exists()?snap.data():{});}catch(e){console.error("Gagal memuat Skill Mastery:",e);alert("Skill Mastery belum dapat dimuat. Periksa koneksi dan izin Firestore.")}}
function render(){
  gallery.replaceChildren();
  layoutTools.hidden = !isAdmin;
  applyViewMode();
  const visibleItems = orderedVideos().filter(item => isAdmin || !(settings[item.file]?.hidden ?? item.hidden));
  if (!visibleItems.length) {
    const empty = document.createElement("div"); empty.className = "empty";
    empty.textContent = "Belum ada video di galeri.";
    gallery.appendChild(empty); return;
  }
  for (const item of visibleItems) {
    const pref = settings[item.file] || {};
    const isHidden = pref.hidden ?? item.hidden;
    const title = pref.title ?? item.title;
    const card = document.createElement("article");
    card.className = "card" + (isHidden ? " hidden-card" : "");
    const dragHandle = document.createElement("div"); dragHandle.className="drag-handle"; dragHandle.textContent="⠿ Geser untuk mengatur urutan";
    const video = document.createElement("video");
    video.src = BASE + item.file; video.controls = true; video.playsInline = true; video.preload = "metadata";
    const cardSpeed = document.createElement("div"); cardSpeed.className="card-speed";
    const speedLabel=document.createElement("label"); const speedText=document.createElement("span"); speedText.textContent="Playback speed"; const speedValue=document.createElement("strong"); speedValue.textContent="1×"; speedLabel.append(speedText,speedValue);
    const speedSlider=document.createElement("input"); speedSlider.type="range"; speedSlider.min="0.25"; speedSlider.max="2"; speedSlider.step="0.25"; speedSlider.value="1"; speedSlider.setAttribute("aria-label","Playback speed");
    speedSlider.addEventListener("pointerdown",e=>{if(!authUser){e.preventDefault();openMemberAccessModal();}});speedSlider.addEventListener("focus",()=>{if(!authUser){speedSlider.blur();openMemberAccessModal();}});speedSlider.addEventListener("input",()=>{if(!authUser){speedSlider.value="1";openMemberAccessModal();return;}video.playbackRate=Number(speedSlider.value);speedValue.textContent=speedSlider.value+"×";});
    cardSpeed.append(speedLabel,speedSlider);
    const titleEl = document.createElement("div"); titleEl.className = "title"; titleEl.textContent = title;
    const description = document.createElement("div"); description.className = "desc"; description.textContent = pref.description ?? item.description ?? "";
    const engagement = document.createElement("div"); engagement.className = "engagement";
    const viewMetric = document.createElement("span"); viewMetric.className = "metric"; viewMetric.innerHTML = "◉ <span>— kali dilihat</span>";
    const likeButton = document.createElement("button"); likeButton.className = "like-button"; likeButton.type = "button"; likeButton.innerHTML = "👍 <span>—</span>"; likeButton.setAttribute("aria-label", "Like video");
    engagement.append(viewMetric, likeButton);
    const actions = document.createElement("div"); actions.className = "actions";
    const analyse = document.createElement("button"); analyse.textContent = "Analisa Video Lab"; analyse.addEventListener("click", () => openAnalysis(item.file));
    actions.appendChild(analyse);
    const masteryButton=document.createElement("button");masteryButton.type="button";masteryButton.className="mastery-button";masteryButton.textContent="✨ Skill Mastery";masteryButton.addEventListener("click",()=>loadMastery(item));
    if (isAdmin && viewMode === "normal") {
      const edit = document.createElement("button"); edit.textContent = "✎ Edit Title";
      edit.addEventListener("click", async () => { const next = prompt("Judul video:", title); if (next === null) return; const clean = next.trim(); if (!clean) { alert("Judul tidak boleh kosong."); return; } const previous={...settings};settings[item.file] = {...settings[item.file], title: clean};try{await saveSharedSettings();saveSettings();render();}catch(e){settings=previous;alert("Judul gagal disimpan ke server. Periksa koneksi dan Firestore Rules.");console.error(e)} });
      const editDescription = document.createElement("button"); editDescription.textContent = "✎ Edit Deskripsi";
      editDescription.addEventListener("click", async () => { const next = prompt("Deskripsi video:", pref.description ?? item.description ?? ""); if (next === null) return; const previous={...settings}; settings[item.file] = {...settings[item.file], description: next.trim()}; try{await saveSharedSettings();saveSettings();render();}catch(e){settings=previous;alert("Deskripsi gagal disimpan ke server. Periksa koneksi dan Firestore Rules.");console.error(e)} });
      const toggle = document.createElement("button"); toggle.textContent = isHidden ? "◉ Show Video" : "◉ Hide Video";
      toggle.addEventListener("click", async () => { const previous={...settings};settings[item.file] = {...settings[item.file], hidden: !isHidden};try{await saveSharedSettings();saveSettings();render();}catch(e){settings=previous;alert("Perubahan gagal disimpan ke server. Periksa Firestore Rules.");console.error(e)} });
      actions.append(edit, editDescription, toggle);
      if (isHidden) { const badge = document.createElement("div"); badge.className = "badge"; badge.textContent = "Video disembunyikan (hanya terlihat dalam Mode Admin)"; card.appendChild(badge); }
    }
    card.append(dragHandle, video, cardSpeed, titleEl, description, engagement, actions, masteryButton); gallery.appendChild(card);
    setupDrag(card,item);
    setupEngagement(item, viewMetric, likeButton);
  }
}
async function initGallery(){
  try {
    const [{ auth, db }, firestore, { onAuthStateChanged }] = await Promise.all([
      import("../firebase.js"),
      import("../firestore.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js")
    ]);
    statsDb = db; firestoreApi = firestore;
    layoutRef = firestore.doc(db,"videoGalleryConfig","layout");
    sharedSettingsRef = firestore.doc(db,"videoGalleryConfig","metadata");
    try { const layoutSnap=await firestore.getDoc(layoutRef); if(layoutSnap.exists()&&Array.isArray(layoutSnap.data().order)){const saved=layoutSnap.data().order;videoOrder=[...saved.filter(file=>VIDEOS.some(v=>v.file===file)),...VIDEOS.map(v=>v.file).filter(file=>!saved.includes(file))];} } catch(e) { console.warn("Belum bisa membaca urutan bersama galeri:",e); }
    onAuthStateChanged(auth, async user => {
      authUser = user || null;
      isAdmin = false;
      if (user) {
        try {
          const snap = await firestore.getDoc(firestore.doc(db, "users", user.uid));
          const role = String(snap.exists() ? snap.data().role || "" : "").toUpperCase();
          isAdmin = role === "ADMIN" || role === "SUPERCOACH";
        } catch (error) {
          console.error("Gagal memeriksa role galeri:", error);
        }
      }
      await loadSharedSettings();
      render();
    });
  } catch (error) {
    console.error("Autentikasi galeri tidak tersedia:", error);
    isAdmin = false;
    render();
  }
}
initGallery();
