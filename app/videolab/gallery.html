<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#183b2b">
<title>Galeri Video — GMTC Video Lab</title>
<style>
:root{--bg:#f2e8d5;--card:#fff;--ink:#2e5d3a;--muted:#607466;--line:rgba(46,93,58,.18)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:900px;margin:0 auto;padding:14px 12px 30px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:var(--card);color:inherit;text-decoration:none;font-weight:600}h1{font-size:clamp(24px,5vw,34px);margin:0}.sub{color:var(--muted);margin-top:5px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button,a.action{font:inherit;font-weight:650;border:1px solid var(--line);border-radius:11px;background:var(--card);color:inherit;padding:10px 12px;cursor:pointer;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;overflow:hidden}.card video{display:block;width:100%;max-height:320px;background:#111;border-radius:10px;object-fit:contain}.desc{white-space:pre-wrap;line-height:1.5;margin:10px 2px 0}.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:20px;line-height:1.5;color:var(--muted)}.note{font-size:12px;color:var(--muted);line-height:1.45;margin:12px 0}
@media(prefers-color-scheme:dark){:root{--bg:#1f241f;--card:#2a302a;--ink:#e6e1d6;--muted:#a8b3a0;--line:rgba(255,255,255,.12)}}
</style></head>
<body><main class="shell">
<header class="top"><a class="back" href="./index.html">← Video Lab</a><div><h1>Tonton Video Galeri</h1><div class="sub">Koleksi video latihan GMTC</div></div></header>
<div id="gallery" class="grid"></div>
<p class="note">Video galeri dibaca dari folder <code>app/asset/videolab/galery/</code>. Untuk menambahkan video, unggah file ke folder tersebut lalu daftarkan nama file dan deskripsinya di daftar VIDEOS pada file gallery.html.</p>
</main>
<script>
const BASE = "../asset/videolab/galery/";
// Tambahkan item baru di daftar ini setelah file video diunggah ke folder BASE.
// Contoh: { file: "backhand.mp4", description: "Backhand — perhatikan posisi siku saat kontak bola." }
const VIDEOS = [];
const gallery = document.getElementById("gallery");
function openAnalysis(file){ location.href = "./analysis.html?video=" + encodeURIComponent(BASE + file); }
if (!VIDEOS.length) {
  gallery.innerHTML = '<div class="empty">Belum ada video di galeri. Setelah video diunggah ke folder galeri dan didaftarkan di kode, setiap video akan tampil sebagai satu kartu dengan deskripsi di bawahnya.</div>';
} else {
  for (const item of VIDEOS) {
    const card = document.createElement("article");
    card.className = "card";
    const video = document.createElement("video");
    video.src = BASE + item.file;
    video.controls = true;
    video.playsInline = true;
    video.preload = "metadata";
    const description = document.createElement("div");
    description.className = "desc";
    description.textContent = item.description || "";
    const actions = document.createElement("div");
    actions.className = "actions";
    const button = document.createElement("button");
    button.textContent = "Analisa Video Lab";
    button.addEventListener("click", () => openAnalysis(item.file));
    actions.appendChild(button);
    card.append(video, description, actions);
    gallery.appendChild(card);
  }
}
</script></body></html>
