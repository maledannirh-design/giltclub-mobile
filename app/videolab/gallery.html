<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#183b2b"><title>Galeri Video — GMTC Video Lab</title>
<style>
:root{--bg:#f2e8d5;--card:#fff;--ink:#2e5d3a;--muted:#607466;--line:rgba(46,93,58,.18)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:900px;margin:0 auto;padding:14px 12px 30px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:var(--card);color:inherit;text-decoration:none;font-weight:600}h1{font-size:clamp(24px,5vw,34px);margin:0}.sub{color:var(--muted);margin-top:5px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button{font:inherit;font-weight:650;border:1px solid var(--line);border-radius:11px;background:var(--card);color:inherit;padding:10px 12px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;overflow:hidden}.card video{display:block;width:100%;max-height:320px;background:#111;border-radius:10px;object-fit:contain}.title{font-size:18px;font-weight:750;margin:10px 2px 0}.engagement{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:8px 2px 0;font-size:14px;color:var(--muted)}.metric{display:inline-flex;align-items:center;gap:5px}.like-button{padding:5px 9px;border-radius:10px;display:inline-flex;align-items:center;gap:6px}.like-button.liked{color:#e65a68;border-color:#e65a68;background:rgba(230,90,104,.08)}.like-button:disabled{opacity:.7;cursor:default}.desc{white-space:pre-wrap;line-height:1.5;margin:7px 2px 0}.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:20px;line-height:1.5;color:var(--muted)}.note{font-size:12px;color:var(--muted);line-height:1.45;margin:12px 0}.admin{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}.hidden-card{opacity:.72;border-style:dashed}.badge{font-size:12px;color:var(--muted)}
@media(prefers-color-scheme:dark){:root{--bg:#1f241f;--card:#2a302a;--ink:#e6e1d6;--muted:#a8b3a0;--line:rgba(255,255,255,.12)}}
</style></head><body><main class="shell">
<header class="top"><a class="back" href="./index.html">← Video Lab</a><div><h1>Tonton Video Galeri</h1><div class="sub">Koleksi video latihan GMTC</div></div></header>

  
<div id="gallery" class="grid"></div>
<p class="note">Sumber video: <code>app/assets/videolab/galery/</code>. Tambahkan file dan daftarkan di array VIDEOS pada file gallery.html.</p>
</main>
<script>
const BASE = "../assets/videolab/galery/";
const VIDEOS = [
  { file: "backhandmechanic.mp4", title: "Backhand Mechanics", description: "Backhand — amati mekanik gerakan dan posisi raket.", hidden: false }
];
const STORAGE_KEY = "gmtc-video-gallery-settings-v1";
const VIEW_STORAGE_KEY = "gmtc-video-gallery-viewed-v1";
const LIKE_STORAGE_KEY = "gmtc-video-gallery-liked-v1";
const statsCache = {};
let statsDb = null;
let authUser = null;
let firestoreApi = null;
let adminMode = false;
let settings = {};
try { settings = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") || {}; } catch { settings = {}; }
const gallery = document.getElementById("gallery");
let isAdmin = false;
function saveSettings(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch {} }
function statDocId(file){ return file.replace(/[^a-zA-Z0-9_-]/g, "_"); }
function getViewerId(){ if(authUser?.uid) return authUser.uid; const key="gmtc-gallery-visitor-id"; let id=localStorage.getItem(key); if(!id){id="visitor_"+(crypto.randomUUID?crypto.randomUUID():Date.now()+"_"+Math.random().toString(36).slice(2));localStorage.setItem(key,id)} return id; }
async function setupEngagement(item, viewMetric, likeButton){
  const id=statDocId(item.file);
  if(!statsDb || !firestoreApi){viewMetric.innerHTML="◉ <span>— kali dilihat</span>";likeButton.innerHTML="👍 <span>—</span>";likeButton.disabled=true;return;}
  const {doc,getDoc,runTransaction,increment,serverTimestamp}=firestoreApi;
  const ref=doc(statsDb,"videoGalleryStats",id);
  const viewer=getViewerId();
  const viewKey=VIEW_STORAGE_KEY+":"+id;
  try{
    let snap=await getDoc(ref);
    let data=snap.exists()?snap.data():{};
    if(!localStorage.getItem(viewKey)){
      await runTransaction(statsDb,async tx=>{const s=await tx.get(ref);if(s.exists())tx.update(ref,{views:increment(1),updatedAt:serverTimestamp()});else tx.set(ref,{file:item.file,views:1,likes:0,likedBy:{},updatedAt:serverTimestamp()})});
      localStorage.setItem(viewKey,"1");
      snap=await getDoc(ref);data=snap.exists()?snap.data():data;
    }
    const likedBy=data.likedBy||{};
    viewMetric.innerHTML="◉ <span>"+Number(data.views||0).toLocaleString("id-ID")+" kali dilihat</span>";
    const liked=!!likedBy[viewer];
    likeButton.classList.toggle("liked",liked);
    likeButton.innerHTML="👍 <span>"+Number(data.likes||0).toLocaleString("id-ID")+"</span>";
    likeButton.setAttribute("aria-pressed",String(liked));
    likeButton.addEventListener("click",async()=>{
      likeButton.disabled=true;
      try{
        await runTransaction(statsDb,async tx=>{
          const s=await tx.get(ref);
          const d=s.exists()?s.data():{views:0,likes:0,likedBy:{}};
          const map={...(d.likedBy||{})};
          if(map[viewer]) delete map[viewer]; else map[viewer]=true;
          tx.set(ref,{file:item.file,views:Number(d.views||0),likes:Object.keys(map).length,likedBy:map,updatedAt:serverTimestamp()},{merge:true});
        });
        const updated=await getDoc(ref);const d=updated.exists()?updated.data():{};
        const nowLiked=!!(d.likedBy||{})[viewer];
        likeButton.classList.toggle("liked",nowLiked);
        likeButton.innerHTML="👍 <span>"+Number(d.likes||0).toLocaleString("id-ID")+"</span>";
        likeButton.setAttribute("aria-pressed",String(nowLiked));
      }catch(err){console.error("Gagal memperbarui like video:",err);alert("Like belum tersimpan. Periksa izin Firestore.");}
      finally{likeButton.disabled=false;}
    });
  }catch(err){console.error("Gagal memuat statistik galeri:",err);viewMetric.innerHTML="◉ <span>— kali dilihat</span>";likeButton.innerHTML="👍 <span>—</span>";likeButton.disabled=true;}
}
function openAnalysis(file){ location.href = "./analysis.html?video=" + encodeURIComponent(BASE + file); }
function render(){
  gallery.replaceChildren();
  const visibleItems = VIDEOS.filter(item => isAdmin || !(settings[item.file]?.hidden ?? item.hidden));
  if (!visibleItems.length) {
    const empty = document.createElement("div"); empty.className = "empty";
    empty.textContent = "Belum ada video di galeri.";
    gallery.appendChild(empty); return;
  }
  for (const item of visibleItems) {
    const pref = settings[item.file] || {};
    const isHidden = pref.hidden ?? item.hidden;
    const title = pref.title ?? item.title;
    const card = document.createElement("article");
    card.className = "card" + (isHidden ? " hidden-card" : "");
    const video = document.createElement("video");
    video.src = BASE + item.file; video.controls = true; video.playsInline = true; video.preload = "metadata";
    const titleEl = document.createElement("div"); titleEl.className = "title"; titleEl.textContent = title;
    const description = document.createElement("div"); description.className = "desc"; description.textContent = pref.description ?? item.description ?? "";
    const actions = document.createElement("div"); actions.className = "actions";
    const analyse = document.createElement("button"); analyse.textContent = "Analisa Video Lab"; analyse.addEventListener("click", () => openAnalysis(item.file));
    actions.appendChild(analyse);
    if (isAdmin) {
      const edit = document.createElement("button"); edit.textContent = "✎ Edit Title";
      edit.addEventListener("click", () => { const next = prompt("Judul video:", title); if (next === null) return; const clean = next.trim(); if (!clean) { alert("Judul tidak boleh kosong."); return; } settings[item.file] = {...settings[item.file], title: clean}; saveSettings(); render(); });
      const editDescription = document.createElement("button"); editDescription.textContent = "✎ Edit Deskripsi";
      editDescription.addEventListener("click", () => { const next = prompt("Deskripsi video:", pref.description ?? item.description ?? ""); if (next === null) return; settings[item.file] = {...settings[item.file], description: next.trim()}; saveSettings(); render(); });
      const toggle = document.createElement("button"); toggle.textContent = isHidden ? "◉ Show Video" : "◉ Hide Video";
      toggle.addEventListener("click", () => { settings[item.file] = {...settings[item.file], hidden: !isHidden}; saveSettings(); render(); });
      actions.append(edit, toggle);
      if (isHidden) { const badge = document.createElement("div"); badge.className = "badge"; badge.textContent = "Video disembunyikan (hanya terlihat dalam Mode Admin)"; card.appendChild(badge); }
    }
    card.append(video, titleEl, description, engagement, actions); gallery.appendChild(card);
    setupEngagement(item, viewMetric, likeButton);
  }
}
async function initGallery(){
  try {
    const [{ auth, db }, firestore, { onAuthStateChanged }] = await Promise.all([
      import("../firebase.js"),
      import("../firestore.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js")
    ]);
    statsDb = db; firestoreApi = firestore;
    onAuthStateChanged(auth, async user => {
      authUser = user || null;
      isAdmin = false;
      if (user) {
        try {
          const snap = await firestore.getDoc(firestore.doc(db, "users", user.uid));
          const role = String(snap.exists() ? snap.data().role || "" : "").toUpperCase();
          isAdmin = role === "ADMIN" || role === "SUPERCOACH";
        } catch (error) {
          console.error("Gagal memeriksa role galeri:", error);
        }
      }
      render();
    });
  } catch (error) {
    console.error("Autentikasi galeri tidak tersedia:", error);
    isAdmin = false;
    render();
  }
}
initGallery();
</script></body></html>
