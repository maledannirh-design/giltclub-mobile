name: GMTC Push Test

on:
  workflow_dispatch:
    inputs:
      target_uid:
        description: "Firebase UID of your own GMTC account"
        required: true
        type: string

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: notifications
        run: npm install --omit=dev
      - name: Send test push to the selected account
        working-directory: notifications
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TARGET_UID: ${{ inputs.target_uid }}
        run: node send-test-notification.js
