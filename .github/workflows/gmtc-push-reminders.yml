name: GMTC Push Reminders

on:
  schedule:
    # Six screenings per day in WITA (UTC+8): 00, 04, 08, 12, 16, 20.
    # GitHub cron uses UTC; the same six-hour marks are represented modulo 24.
    - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch:

concurrency:
  group: gmtc-push-reminders
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: notifications/package.json
      - name: Install dependencies
        working-directory: notifications
        run: npm install --omit=dev
      - name: Screen upcoming sessions and send reminders
        working-directory: notifications
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: npm run remind
